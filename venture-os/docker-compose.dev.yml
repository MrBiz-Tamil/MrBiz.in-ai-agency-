# Development overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Publishes Postgres and Redis on 127.0.0.1 only, for psql / redis-cli / the Go services run on the host.
# They are attached to an extra non-internal network because Docker cannot publish ports from an
# `internal` network. Nothing else changes: agents still have no route to the databases.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [data, devaccess]

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks: [data, devaccess]

networks:
  devaccess:
    driver: bridge
