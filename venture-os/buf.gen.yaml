# Requires protoc-gen-go and protoc-gen-connect-go on PATH. scripts/gen-proto.ps1 installs pinned versions.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mrbiz/venture-os/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
