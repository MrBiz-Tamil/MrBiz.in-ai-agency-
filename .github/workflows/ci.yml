name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-core/go.mod
          cache-dependency-path: backend-core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pgtest/package-lock.json
      - name: Install the in-process Postgres used by the DB integration tests
        working-directory: tools/pgtest
        run: npm ci
      - name: Format check
        run: test -z "$(gofmt -l cmd pkg/auth pkg/db pkg/events pkg/gqlsec pkg/graphql/*.go pkg/grpc pkg/ingest pkg/kernel pkg/mcp pkg/tenant pkg/tickets pkg/vault pkg/voice | grep -v generated.go | grep -v models_gen.go)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  integration:
    # Go <-> Python gRPC contract test against the real AI service.
    runs-on: ubuntu-latest
    needs: [backend-go, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-core/go.mod
          cache-dependency-path: backend-core/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ai-service/requirements.txt
      - name: Go -> Python gRPC integration
        working-directory: backend-core
        env:
          ABOS_INTEGRATION: "1"
          ABOS_PYTHON: python
        run: go test ./pkg/grpc/ -run TestAIClient_Integration -v
