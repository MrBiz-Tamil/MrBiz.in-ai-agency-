name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: venture-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: venture-os/go.mod
          cache-dependency-path: venture-os/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: venture-os/tools/pgtest/package-lock.json
      - name: Install the in-process Postgres used by the DB tests
        working-directory: venture-os/tools/pgtest
        run: npm ci
      - name: Format check
        run: test -z "$(gofmt -l cmd internal | grep -v '/gen/')"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: venture-os/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: venture-os/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
