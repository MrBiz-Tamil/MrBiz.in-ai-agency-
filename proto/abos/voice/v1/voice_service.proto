syntax = "proto3";

package abos.voice.v1;

option go_package = "github.com/mrbiz/abos/backend-core/pkg/gen/voice/v1;voicev1";

service VoiceOrchestratorService {
  // Streams real-time audio chunks for the Talker Agent
  rpc StreamTalkerAudio (StreamTalkerAudioRequest) returns (stream StreamTalkerAudioResponse);

  // Dispatches an asynchronous ERP mutation while preserving voice conversation continuity
  rpc DispatchVoiceMutation (DispatchVoiceMutationRequest) returns (DispatchVoiceMutationResponse);

  // Streams real-time call telemetry and transcripts for supervisor monitoring
  rpc StreamCallTelemetry (StreamCallTelemetryRequest) returns (stream StreamCallTelemetryResponse);
}

message StreamTalkerAudioRequest {
  string call_id = 1;
  int64 sequence_number = 2;
  bytes audio_bytes = 3;
  string encoding = 4; // "pcm_16000", "opus"
  bool is_final = 5;
}

message StreamTalkerAudioResponse {
  string call_id = 1;
  int64 sequence_number = 2;
  bytes audio_bytes = 3;
  string encoding = 4;
  bool is_final = 5;
}

message DispatchVoiceMutationRequest {
  string workspace_id = 1;
  string call_id = 2;
  string caller_phone = 3;
  string action_type = 4;
  string payload_json = 5;
  string idempotency_key = 6;
}

message DispatchVoiceMutationResponse {
  string ticket_id = 1;
  string status = 2; // "QUEUED", "EXECUTED", "HELD"
  string conversational_ack = 3; // "I have submitted that address change for verification."
}

message StreamCallTelemetryRequest {
  string workspace_id = 1;
  string call_id = 2;
}

message StreamCallTelemetryResponse {
  string call_id = 1;
  int32 elapsed_seconds = 2;
  string sentiment = 3; // "POSITIVE", "NEUTRAL", "FRUSTRATED"
  string transcript_delta = 4;
  bool supervisor_escalation_flag = 5;
}
